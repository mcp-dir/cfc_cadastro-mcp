# Smithery configuration for Conselho Federal de Contabilidade: Cadastro de Profissionais e Empresas
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_cfc_cadastro

name: cfc_cadastro-mcp
displayName: "Conselho Federal de Contabilidade: Cadastro de Profissionais e Empresas"
description: >
  Conselho Federal de Contabilidade: Cadastro de Profissionais e Empresas, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/cfc_cadastro-mcp
repository: https://github.com/mcp-dir/cfc_cadastro-mcp

tags:
  - cfc_cadastro
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_cfc_cadastro

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_cfc_cadastro/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
